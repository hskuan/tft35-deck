; USB bridge for the TFT35 Deck
;
;   PC (OpenDeck + plugin) <-- USB: HID keyboard + CDC serial --> bridge <-- UART --> BTT TFT35 V3.0
;
; Targets (pins in src/config.h, board differences in src/board_*.cpp):
;   esp32s3_supermini  ESP32-S3 SuperMini, the real bridge (default)
;   pico               Raspberry Pi Pico W, stand-in for testing the logic
;
;   pio run -e esp32s3_supermini -t upload
;   pio run -e pico -t upload

[platformio]
default_envs = esp32s3_supermini

[env]
monitor_speed = 115200

[env:esp32s3_supermini]
; 6.9.0 = arduino-esp32 2.0.17. Not older: core 2.0.6 (platform 5.4.0) does not
; re-enable the D+ pull-up when handing USB back to the built-in serial/JTAG
; port, so after the upload reset the board vanished from USB until replugged.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; SuperMini: ESP32-S3 with 4 MB flash and one USB-C port (native USB)
; Upload without buttons: a 1200-baud touch on the deck's CDC port makes the
; firmware restart into ROM download mode on the built-in USB serial/JTAG
; port, which is a different COM port; wait for it and upload there.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; That restart sets RTC "force download boot"; the bundled esptool (4.5.1) does
; not clear it on hard reset, so the board would stay in download mode after
; every upload. tools/esp32s3_exit_download.py clears it and resets.
extra_scripts = post:tools/esp32s3_exit_download.py
board_upload.flash_size = 4MB
board_upload.maximum_size = 1310720
board_build.partitions = default.csv
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  ; TinyUSB device stack on the native USB port, so the sketch defines its own
  ; USB interfaces (HID keyboard, consumer control, CDC) instead of the
  ; default JTAG/serial console
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
; Stay at the RP2040's default 125 MHz: any other F_CPU makes the core re-clock
; the system and the SDK moves clk_peri to the 48 MHz USB PLL, which caps the
; UART at 3 Mbaud (3.75 M silently became 3 M -> framing errors on the TFT).
board_build.f_cpu = 125000000L
; the core's Keyboard library includes tusb-hid; let the library finder follow it
lib_ldf_mode = chain+
