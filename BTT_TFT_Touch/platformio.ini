; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; BIGTREETECH TFT35 V3.0
;   MCU:    STM32F207VCT6, Cortex-M3 @ 120 MHz, 256 KB flash, 128 KB SRAM
;   Flash:  0x08000000-0x08007FFF BTT bootloader, app at 0x08008000 (224 KB)
;   Board:  boards/btt_tft35_v3.json (reuses the stm32duino NUCLEO_F207ZG
;           variant; pins are addressed by name, e.g. PE6, so the 144-pin
;           variant works on the 100-pin VC part)
;   Flash via SD card: copy .pio/build/btt_tft35_v3/BIGTREE_TFT35_V3.0.<ver>.bin
;           to the root of a FAT32 SD card (<= 8 GB) and reset the TFT.
;   Recovery: ST-Link on the SWD header (upload_protocol = stlink).

[env:btt_tft35_v3]
; Pinned: board_init.c and the linker script are written against this
; platform's stm32duino 1.9 core (variant path, VTOR handling).
platform = ststm32@12.1.1
board = btt_tft35_v3
framework = arduino
board_build.ldscript = ldscripts/btt_tft35_v3_0x8000.ld
custom_fw_version = 90.x
extra_scripts = pre:scripts/btt_firmware_name.py
build_flags =
  -DHSE_VALUE=8000000U
  -DBTT_TFT35_V3_0
monitor_speed = 115200
